name: Auto-label trusted PRs for Claude review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

jobs:
  add-label:
    if: |
      github.event.pull_request.user.login == 'pronskiy' ||
      github.event.pull_request.user.login == 'carlos-granados'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - run: gh pr edit "$PR" --repo "$REPO" --add-label claude-review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
