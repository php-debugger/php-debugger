name: Build

on:
    push:
        branches:
            - main
            - phase2-observer-migration
    pull_request:
    workflow_dispatch:
        inputs:
            php-version:
                description: 'PHP version to build'
                required: false
                default: '8.6'
                type: choice
                options:
                    - '8.2'
                    - '8.3'
                    - '8.4'
                    - '8.5'
                    - '8.6'

permissions:
    contents: read

# A newer push to a pull request supersedes its older run; other runs
# (pushes, manual runs) each get their own group, so none is dropped
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build-unix:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      name: macOS (Apple Silicon)
                    - os: ubuntu-latest
                      name: Linux (x86_64)
        runs-on: ${{ matrix.os }}
        name: "${{ matrix.name }} — PHP ${{ inputs.php-version || '8.6' }}"
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Setup PHP
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    php-version: ${{ inputs.php-version || '8.6' }}
                    coverage: none
                    extensions: xmlreader

            -   name: Build extension
                run: |
                    phpize
                    ./configure --enable-php-debugger
                    make -j$(sysctl -n hw.logicalcpu 2>/dev/null || nproc)

            -   name: Verify extension loads
                run: |
                    php -dzend_extension=$PWD/modules/php_debugger.so -v
                    php -dzend_extension=$PWD/modules/php_debugger.so -r "echo 'xdebug_info() works: ' . (function_exists('xdebug_info') ? 'yes' : 'no') . PHP_EOL;"

            -   name: Smoke test (DBGp)
                run: |
                    TEST_PHP_ARGS="-n -dzend_extension=$PWD/modules/php_debugger.so"
                    echo "TEST_PHP_ARGS=$TEST_PHP_ARGS" >> $GITHUB_ENV
                    export TEST_PHP_ARGS
                    php -n run-xdebug-tests.php -q tests/debugger/bug00530.phpt

            -   name: Get build info
                id: info
                run: |
                    PHP_VER=$(php -r "echo PHP_MAJOR_VERSION . '.' . PHP_MINOR_VERSION;")
                    OS_TAG=$(echo "${{ matrix.os }}" | sed 's/-latest//')
                    ARCH=$(uname -m)
                    echo "artifact_name=php-debugger-php${PHP_VER}-${OS_TAG}-${ARCH}" >> $GITHUB_OUTPUT

            -   name: Upload artifact
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: ${{ steps.info.outputs.artifact_name }}
                    path: modules/php_debugger.so
                    retention-days: 90

    build-windows:
        strategy:
            fail-fast: false
            matrix:
                ts:
                    - nts
                    - ts
        # PHP 8.6 and later are built with VS 2026, which only the
        # windows-2025-vs2026 image has
        runs-on: ${{ contains(fromJSON('["8.2","8.3","8.4","8.5"]'), inputs.php-version || '8.6') && 'windows-2022' || 'windows-2025-vs2026' }}
        name: "Windows (x64) — PHP ${{ inputs.php-version || '8.6' }} — ${{ matrix.ts == 'ts' && 'TS' || 'NTS' }}"
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Build the extension
                uses: php/php-windows-builder/extension@227d3cb94e4fd9e9ab9459020df2394ee9a00eb4 # 1.10.0
                with:
                    php-version: ${{ inputs.php-version || '8.6' }}
                    arch: x64
                    ts: ${{ matrix.ts }}
                    args: --enable-php-debugger
                    run-tests: false

            -   name: Get build info
                id: info
                shell: bash
                run: |
                    PHP_VER="${{ inputs.php-version || '8.6' }}"
                    TS_TAG="${{ matrix.ts }}"
                    echo "artifact_name=php-debugger-php${PHP_VER}-${TS_TAG}-windows-x64" >> $GITHUB_OUTPUT

            -   name: Find DLL
                id: find-dll
                shell: pwsh
                run: |
                    $dll = Get-ChildItem -Path ${{ runner.temp }} -Recurse -Filter 'php_php_debugger.dll' | Select-Object -First 1
                    if (-not $dll) {
                        $dll = Get-ChildItem -Recurse -Filter 'php_php_debugger.dll' | Select-Object -First 1
                    }
                    if (-not $dll) { Write-Error 'php_php_debugger.dll not found'; exit 1 }
                    Write-Host "Found DLL at: $($dll.FullName)"
                    echo "dll_path=$($dll.FullName)" >> $env:GITHUB_OUTPUT

            -   name: Upload artifact
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: ${{ steps.info.outputs.artifact_name }}
                    path: ${{ steps.find-dll.outputs.dll_path }}
                    if-no-files-found: error
                    retention-days: 90
