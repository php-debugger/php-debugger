name: "Sanitizer Tests (ASAN + UBSAN)"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request supersedes its older run; other runs
# (pushes, manual runs) each get their own group, so none is dropped
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sanitizers:
    name: "ASAN + UBSAN — PHP ${{ matrix.php }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    env:
      ASAN_OPTIONS: "detect_leaks=1:detect_stack_use_after_return=1:abort_on_error=1"
      UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
      DBGP_TIMEOUT: "10"

    steps:
      - name: Checkout extension
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool \
            clang llvm libxml2-dev libsqlite3-dev pkg-config

      # The latest php.net release of this PHP version, as the release
      # workflow builds against
      - name: Resolve PHP source
        id: php-source
        run: |
          SOURCE=$(python3 .github/scripts/resolve-php-sources.py "${{ matrix.php }}" | jq -c '.["${{ matrix.php }}"]')
          echo "version=$(jq -r .version <<<"$SOURCE")" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r .url <<<"$SOURCE")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(jq -r .sha256 <<<"$SOURCE")" >> "$GITHUB_OUTPUT"

      # Keyed on the exact PHP release, so a new patch release is built afresh
      - name: Cache PHP build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: php-cache
        with:
          path: ~/php-install
          key: php-asan-${{ steps.php-source.outputs.version }}-${{ hashFiles('.github/workflows/sanitizers.yml') }}

      - name: Build PHP with sanitizers
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: |
          # The release tarball ships configure and the generated sources:
          # no buildconf, bison or re2c needed
          sh .github/scripts/fetch-php-source.sh "${{ steps.php-source.outputs.url }}" "${{ steps.php-source.outputs.sha256 }}" ~/php-src
          cd ~/php-src

          CC=clang CXX=clang++ \
          ./configure \
            --prefix=$HOME/php-install \
            --enable-debug \
            --enable-address-sanitizer \
            --enable-undefined-sanitizer \
            --disable-all \
            --enable-cli \
            --enable-session \
            --enable-xml \
            --with-libxml \
            --enable-opcache=no \
            --without-pear

          make -j4
          make install

      - name: Build extension with sanitizers
        run: |
          export PATH="$HOME/php-install/bin:$PATH"
          phpize
          CC=clang CXX=clang++ \
          CFLAGS="-fsanitize=address,undefined -fno-sanitize=function -fno-omit-frame-pointer -g" \
          LDFLAGS="-fsanitize=address,undefined -fno-sanitize=function" \
          ./configure --enable-php-debugger --with-php-config=$HOME/php-install/bin/php-config
          make -j4

      - name: Verify extension loads
        run: |
          export PATH="$HOME/php-install/bin:$PATH"
          php -d "zend_extension=$PWD/modules/php_debugger.so" -v

      - name: Run tests under sanitizers
        run: |
          export PATH="$HOME/php-install/bin:$PATH"
          export TEST_PHP_EXECUTABLE=$(which php)
          export TEST_PHP_ARGS="-n -d session.save_path=/tmp -d zend_extension=$PWD/modules/php_debugger.so"
          php -n run-xdebug-tests.php --asan -j4 -q --show-diff tests/debugger/ 2>&1 | tee test-output.log || true

          # Fail only on real sanitizer errors, not test output mismatches
          if grep -qE "(AddressSanitizer|LeakSanitizer|runtime error|SUMMARY.*Sanitizer)" test-output.log; then
            echo "::error::Sanitizer errors detected!"
            grep -E "(AddressSanitizer|LeakSanitizer|runtime error|SUMMARY)" test-output.log
            exit 1
          fi
          echo "No sanitizer errors found"

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanitizer-logs-${{ matrix.php }}
          path: |
            tests/debugger/*.log
            tests/debugger/*.diff
