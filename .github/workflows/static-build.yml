name: "Static Build"

on:
  push:
    branches: [main]
    paths:
      - 'config.m4'
      - 'php_php_debugger.h'
      - 'xdebug.c'
      - '.github/workflows/static-build.yml'
      - '.github/scripts/resolve-php-sources.py'
      - '.github/scripts/fetch-php-source.sh'
  pull_request:
    paths:
      - 'config.m4'
      - 'php_php_debugger.h'
      - 'xdebug.c'
      - '.github/workflows/static-build.yml'
      - '.github/scripts/resolve-php-sources.py'
      - '.github/scripts/fetch-php-source.sh'

permissions:
  contents: read

# A newer push to a pull request supersedes its older run; other runs
# (pushes, manual runs) each get their own group, so none is dropped
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-build:
    name: "Static — PHP ${{ matrix.php }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - name: Checkout extension
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ext-src

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # No bison or re2c: the release tarball ships the generated sources
          sudo apt-get install -y build-essential autoconf automake libtool \
            libxml2-dev libsqlite3-dev pkg-config

      # The latest php.net release of this PHP version, as the release
      # workflow builds against
      - name: Download PHP source
        run: |
          SOURCE=$(python3 ext-src/.github/scripts/resolve-php-sources.py "${{ matrix.php }}" | jq -c '.["${{ matrix.php }}"]')
          sh ext-src/.github/scripts/fetch-php-source.sh "$(jq -r .url <<<"$SOURCE")" "$(jq -r .sha256 <<<"$SOURCE")" ~/php-src

      - name: Copy extension into php-src
        run: |
          cp -r ext-src ~/php-src/ext/php_debugger
          mkdir -p ~/php-src/m4
          cp ext-src/m4/*.m4 ~/php-src/m4/

      - name: Build PHP with static php_debugger
        run: |
          cd ~/php-src
          ./buildconf --force
          ./configure \
            --disable-all \
            --enable-cli \
            --enable-session \
            --enable-php-debugger \
            --without-pear
          make -j$(nproc)

      - name: Verify extension is statically linked
        run: |
          cd ~/php-src
          ./sapi/cli/php -m | grep -q php_debugger
          ./sapi/cli/php -v | grep -q "PHP Debugger"

      - name: Smoke test — extension_loaded
        run: |
          cd ~/php-src
          ./sapi/cli/php -r "
            assert(extension_loaded('php_debugger'), 'php_debugger not loaded');
            echo 'extension_loaded: OK' . PHP_EOL;
          "

      - name: Smoke test — INI settings
        run: |
          cd ~/php-src
          ./sapi/cli/php -r "
            assert(ini_get('xdebug.client_port') !== false, 'xdebug.* INI missing');
            assert(ini_get('php_debugger.client_port') !== false, 'php_debugger.* INI missing');
            echo 'INI settings: OK' . PHP_EOL;
          "

      - name: Smoke test — functions
        run: |
          cd ~/php-src
          ./sapi/cli/php -r "
            assert(function_exists('xdebug_break'), 'xdebug_break missing');
            assert(function_exists('xdebug_info'), 'xdebug_info missing');
            assert(function_exists('php_debugger_info'), 'php_debugger_info missing');
            echo 'Functions: OK' . PHP_EOL;
          "
